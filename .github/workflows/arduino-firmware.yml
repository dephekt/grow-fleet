# Non-ESPHome (Arduino) fleet firmware — sibling to firmware.yml.
# Builds arduino_devices from fleet.yaml with arduino-cli, LZSS-compresses +
# wraps the binary into a .ota, and publishes the same grow-firmware-package.v1
# OCI artifact grow-app already serves. Reuses scripts/{build_arduino,
# publish_packages,fleetlib,install_firmware_secrets}.py. The ESPHome firmware.yml
# is untouched.
name: Arduino Firmware

on:
  push:
    # Deliberately NO `paths:` filter here. GitHub applies push path-filters to TAG
    # pushes too, and a release tag (arduino-firmware/<device>/vX.Y.Z) points at a
    # commit already on main — so it carries no changed paths matching this list and
    # the stable-publish would be silently skipped. firmware.yml omits paths on push
    # for the same reason; the pull_request trigger below keeps its filter.
    branches: [main]                     # edge publish
    tags: ["arduino-firmware/**"]        # stable publish (arduino-firmware/<device>/vX.Y.Z)
  pull_request:
    paths:
      - "arduino/**"
      - "scripts/build_arduino.py"
      - "fleet.yaml"
      - ".github/workflows/arduino-firmware.yml"
  workflow_dispatch:

env:
  OCI_REGISTRY: ghcr.io
  OCI_OWNER: dephekt
  OCI_PACKAGE_PREFIX: grow-fleet

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2
      - name: Install core + libraries
        # Pinned for reproducible builds (matches the versions the firmware was
        # validated against). Bump deliberately; an unpinned core/lib release could
        # silently change the compiled binary or break the build. cf. esphome:2026.5.
        run: |
          set -eu
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno@1.6.0
          arduino-cli lib install ArduinoJson@7.4.3 ArduinoHttpClient@0.6.1 ArduinoMqttClient@0.1.8

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2.0.0
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - id: publish_ready
        name: Check protected publish configuration
        env:
          FLEET_SECRETS_YAML_B64: ${{ secrets.FLEET_SECRETS_YAML_B64 }}
        run: |
          set -eu
          # Publish only on push events — a main push (edge) or a release tag (stable).
          # pull_request and workflow_dispatch are compile-only, so a manual dispatch
          # from a feature branch can't push an edge package built from unmerged code
          # (firmware.yml keeps its dispatch compile-only for the same reason).
          if [ -z "${FLEET_SECRETS_YAML_B64:-}" ] || [ "${{ github.event_name }}" != "push" ]; then
            echo "::notice::Compile-only (no FLEET_SECRETS_YAML_B64, or not a push event)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install firmware secrets
        if: steps.publish_ready.outputs.ready == 'true'
        env:
          FLEET_SECRETS_YAML_B64: ${{ secrets.FLEET_SECRETS_YAML_B64 }}
        run: uv run --locked python scripts/install_firmware_secrets.py --require-flashable

      - id: meta
        name: Resolve device(s) + version + profile
        env:
          READY: ${{ steps.publish_ready.outputs.ready }}
        run: |
          set -eu
          if [[ "${GITHUB_REF:-}" == refs/tags/arduino-firmware/* ]]; then
            rest="${GITHUB_REF_NAME#arduino-firmware/}"
            device="${rest%%/v*}"
            version="${GITHUB_REF_NAME#arduino-firmware/${device}/}"
            devices="$device"
          else
            # edge: build/publish every device registered under arduino_devices in fleet.yaml
            devices="$(uv run --locked python -c 'import yaml; print(" ".join((yaml.safe_load(open("fleet.yaml")).get("arduino_devices") or {}).keys()))')"
            version="edge-$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short=12 HEAD)"
          fi
          if [ "$READY" = "true" ]; then profile="site-private"; else profile="ci-placeholder"; fi
          echo "devices=$devices" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.publish_ready.outputs.ready == 'true'
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          if [ -z "${GHCR_USER:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
            echo "GHCR_USER and GHCR_TOKEN are required to publish" >&2
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" | oras login "$OCI_REGISTRY" -u "$GHCR_USER" --password-stdin

      - name: Build, package, and (when configured) publish
        env:
          OCI_SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          set -eu
          extra=""
          if [ "${{ steps.meta.outputs.profile }}" = "site-private" ]; then
            extra="--require-flashable-secrets --publish"
          fi
          for device in ${{ steps.meta.outputs.devices }}; do
            uv run --locked python scripts/build_arduino.py "$device" \
              --version "${{ steps.meta.outputs.version }}" \
              --source-sha "$(git rev-parse HEAD)" \
              --build-profile "${{ steps.meta.outputs.profile }}" \
              $extra
          done
