name: checks

on:
  # The push trigger deliberately carries no `paths:` filter — a merge to main
  # re-runs every job repo-wide, which is the convention firmware.yml and
  # arduino-firmware.yml also follow. That makes the pull_request list below the
  # only gate that runs before review, so anything a PR can change and a job here
  # checks MUST be listed: a path that matches nothing means the PR runs no CI at
  # all rather than a reduced subset. publishers/** was exactly that gap.
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "devices/**"
      - "publishers/**"
      - "fleet.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/checks.yml"
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Run pytest
        run: uv run --locked python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Run ruff check
        run: uv run --locked ruff check

      - name: Run ruff format --check
        run: uv run --locked ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Run mypy
        run: uv run --locked mypy

  go:
    runs-on: ubuntu-latest
    # `go test -race` takes ~25s cold for the whole module — internal/mqttpub
    # stands up a real embedded broker rather than faking the protocol, and the
    # race detector roughly doubles the build. 10 minutes leaves room for a cold
    # module cache and both builds while still cutting off a wedged broker test
    # instead of letting it burn the default six-hour budget.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: publishers/apogee-sq521
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # `uses:` steps ignore defaults.run.working-directory, so these two paths
      # stay repo-relative.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: publishers/apogee-sq521/go.mod
          cache-dependency-path: publishers/apogee-sq521/go.sum

      - name: Check gofmt
        run: |
          set -eu
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run go test -race
        run: go test -race -timeout 5m ./...

      # An explicit cgo-freeness assertion, not a redundant build. The daemon is
      # compiled on an x86_64 runner for an arm64 Raspberry Pi, so a dependency
      # that drags in cgo would either need a cross toolchain here or produce a
      # binary bound to the runner's glibc. With CGO_ENABLED=0 that failure
      # surfaces in CI instead of on the Pi.
      - name: Assert the module is cgo-free (linux/arm64 cross-build)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build ./...
