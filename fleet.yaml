# NOTE: informational only — packaging reads the true component provenance from
# each device YAML's external_components block (scripts/fleetlib.py
# device_component_dependency), not from this anchor.
component_dependency: &stackdrift_esphome_components
  source:
    type: git
    url: https://github.com/dephekt/esphome-components.git
    ref: 1a668c0abca54137ed67dc78bfd564ca34110338
    path: .

devices:
  atlas-hydro-kit:
    config: devices/atlas-hydro-kit.yaml
    esphome_name: atlas-hydro-monitor
    node_id: atlas-hydro-monitor
    project_name: stackdrift.atlas-hydro-kit
    package: atlas-hydro-kit
    package_owner: stackdrift-firmware
    chip_family: ESP32
    release: true
    component_dependency: *stackdrift_esphome_components
  atoms3u-sensor-rig:
    config: devices/atoms3u-sensor-rig.yaml
    esphome_name: atoms3u-sensor-rig
    node_id: atoms3u-sensor-rig
    project_name: stackdrift.atoms3u-sensor-rig
    package: atoms3u-sensor-rig
    package_owner: stackdrift-firmware
    chip_family: ESP32-S3
    release: true
    assets:
      - assets/thermal_overlay.js
    component_dependency: *stackdrift_esphome_components
  grow-light:
    config: devices/grow-light.yaml
    esphome_name: grow-light
    node_id: grow-light
    project_name: stackdrift.grow-light
    package: grow-light
    package_owner: stackdrift-firmware
    chip_family: ESP8266
    release: true
    # assets = extra watched firmware inputs for CI impact detection; the
    # shared plug base is compiled into this device via ESPHome packages.
    # Anchored so the other Athom plugs reference the same list (see the
    # &stackdrift_esphome_components convention above).
    assets: &athom_plug_assets
      - devices/packages/athom-plug-base.yaml
    component_dependency: *stackdrift_esphome_components
  irrigation-pump:
    config: devices/irrigation-pump.yaml
    esphome_name: irrigation-pump
    node_id: irrigation-pump
    project_name: stackdrift.irrigation-pump
    package: irrigation-pump
    package_owner: stackdrift-firmware
    chip_family: ESP8266
    release: true
    assets: *athom_plug_assets
    # no component_dependency: this config declares no external_components
  m5dial-controller:
    config: devices/m5dial-controller.yaml
    esphome_name: m5dial-controller
    node_id: m5dial-controller
    project_name: stackdrift.m5dial-controller
    package: m5dial-controller
    package_owner: stackdrift-firmware
    chip_family: ESP32-S3
    release: true
    # NOT the shared &stackdrift_esphome_components anchor: this device needs m5dial_spectrum,
    # which does not exist at that pinned commit. Collapse this back onto the anchor once the
    # component is merged to esphome-components main and the shared ref is bumped past it.
    component_dependency:
      source:
        type: git
        url: https://github.com/dephekt/esphome-components.git
        # Unpushed — on branch feat/m5dial-spectrum. Must be pushed before CI can build this device.
        ref: bfa90791bbba66ec0a4ba39499b0b3b9c89d2536
        path: .
  m5stack-airq:
    config: devices/m5stack-airq.yaml
    esphome_name: m5stack-airq
    node_id: m5stack-airq
    project_name: stackdrift.m5stack-airq
    package: m5stack-airq
    package_owner: stackdrift-firmware
    chip_family: ESP32-S3
    release: true
    component_dependency: *stackdrift_esphome_components
  runoff-monitor:
    config: devices/runoff-monitor.yaml
    esphome_name: runoff-monitor
    node_id: runoff-monitor
    project_name: stackdrift.runoff-monitor
    package: runoff-monitor
    package_owner: stackdrift-firmware
    chip_family: ESP8266
    release: true
    assets: *athom_plug_assets
    # no component_dependency: this config declares no external_components

# Non-ESPHome (Arduino) fleet firmware. Built/packaged/published by
# scripts/build_arduino.py (arduino-cli -> lzss -> bin2ota -> oras), which reuses
# the same grow-firmware-package.v1 manifest + OCI publish as the ESPHome devices,
# so grow-app serves them identically. The ESPHome `devices:` map above is parsed
# separately and is unaffected.
arduino_devices:
  spectrometer:
    sketch: arduino/spectrometer
    fqbn: arduino:renesas_uno:unor4wifi
    node_id: spectrometer
    project_name: stackdrift.spectrometer
    package: spectrometer
    package_owner: stackdrift-firmware
    chip_family: UNO-R4-WIFI
    release: true
