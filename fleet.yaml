# NOTE: informational only — packaging reads the true component provenance from
# each device YAML's external_components block (scripts/fleetlib.py
# device_component_dependency), not from this anchor.
component_dependency: &stackdrift_esphome_components
  source:
    type: git
    url: https://github.com/dephekt/esphome-components.git
    ref: 744d21a1bd464af921b22e40affafd69aa5893a1
    path: .

devices:
  atlas-hydro-kit:
    config: devices/atlas-hydro-kit.yaml
    esphome_name: atlas-hydro-monitor
    node_id: atlas-hydro-monitor
    project_name: stackdrift.atlas-hydro-kit
    package: atlas-hydro-kit
    package_owner: stackdrift-firmware
    chip_family: ESP32
    release: true
    component_dependency: *stackdrift_esphome_components
  atoms3u-sensor-rig:
    config: devices/atoms3u-sensor-rig.yaml
    esphome_name: atoms3u-sensor-rig
    node_id: atoms3u-sensor-rig
    project_name: stackdrift.atoms3u-sensor-rig
    package: atoms3u-sensor-rig
    package_owner: stackdrift-firmware
    chip_family: ESP32-S3
    release: true
    assets:
      - assets/thermal_overlay.js
    component_dependency: *stackdrift_esphome_components
  feather-air-monitor:
    config: devices/feather-air-monitor.yaml
    esphome_name: feather-air-monitor
    node_id: feather-air-monitor
    project_name: stackdrift.feather-air-monitor
    package: feather-air-monitor
    package_owner: stackdrift-firmware
    chip_family: ESP32-S2
    release: true
    component_dependency: *stackdrift_esphome_components
  grow-light:
    config: devices/grow-light.yaml
    esphome_name: grow-light
    node_id: grow-light
    project_name: stackdrift.grow-light
    package: grow-light
    package_owner: stackdrift-firmware
    chip_family: ESP8266
    release: true
    component_dependency: *stackdrift_esphome_components
  m5stack-airq:
    config: devices/m5stack-airq.yaml
    esphome_name: m5stack-airq
    node_id: m5stack-airq
    project_name: stackdrift.m5stack-airq
    package: m5stack-airq
    package_owner: stackdrift-firmware
    chip_family: ESP32-S3
    release: true
    component_dependency: *stackdrift_esphome_components
