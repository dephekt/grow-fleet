# M5Stack AirQ (K131 / v1.1) — AIR-QUALITY trend node on a StampS3 (ESP32-S3FN8).
#
# Scope is deliberately air quality only: CO2, PM1/2.5/4/10, VOC, NOx. The
# onboard temp/RH are NOT surfaced and there is no temp/RH/VPD alerting — the
# SCD40 self-heats badly in this enclosure (raw runs ~15.6°C above ambient; its
# temp/RH/VPD were validated useless against a SwitchBot + 3 HomePods on
# 2026-05-31), so this device is treated purely as a VOC/PM/CO2 monitor.
#
# Onboard hardware, all I2C on the internal bus_a (SDA=11 / SCL=12 @ 50kHz):
#   Sensirion SCD40  (CO2 + temp/RH)          @ 0x62 -> stock scd4x
#                                                     + scd4x_stats + scd4x_alerts (CO2-only)
#     temp/RH are kept internal: true (hidden) only because scd4x_stats/alerts
#     require those refs; they are not exposed.
#   Sensirion SEN55  (PM1/2.5/4/10, VOC, NOx) @ 0x69 -> stock sen5x (PM full mode)
#     Power-gated by GPIO10: must be driven HIGH before sen5x init (on_boot p800).
#   1.54" e-ink 200x200 (GDEW0154-class) on SPI -> stock waveshare_epaper "1.54inv2"
#     clk=5 mosi=6 | cs=4 dc=3 rst=2 busy=1
#
# Stock unit "reboots every ~10s" = M5 factory firmware deep-sleeping between
# ThingsCloud uploads; this config has NO deep_sleep so it stays awake and serves
# web/API + drives the e-ink. Intended USB-powered.
#
# Build / flash. First flash needs download mode (hold G0 while plugging USB);
# after that, flashes are OTA over WiFi:
#   esphome run devices/m5stack-airq.yaml --device /dev/ttyACM0       # first (USB)
#   esphome run devices/m5stack-airq.yaml --device m5stack-airq.local # thereafter (OTA)

substitutions:
  devicename: m5stack-airq
  friendlyname: "M5Stack AirQ"
  firmware_version: dev
  grow_app_base_url: "http://192.168.8.3:3080"
  package_owner: stackdrift-firmware
  firmware_update_token: !secret firmware_update_token
  sensor_interval: 60s   # SCD40/SEN55 poll + e-ink refresh cadence

esphome:
  name: ${devicename}
  friendly_name: ${friendlyname}
  project:
    name: stackdrift.m5stack-airq
    version: ${firmware_version}
  on_boot:
    # Power-gate the SEN55 on as early as possible (before sensor/i2c setup at
    # lower priority) so its first measurement command lands on a live sensor.
    - priority: 800
      then:
        - output.turn_on: sen55_power

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB   # StampS3 = ESP32-S3FN8: 8MB flash, no PSRAM
  framework:
    type: arduino

# scd4x, sen5x, and waveshare_epaper are all native ESPHome — only the two
# SCD4x value-add components come from this repo.
external_components:
  - source:
      type: git
      url: https://github.com/dephekt/esphome-components.git
      ref: 0926abf947d3cba3c43d1bf1d29de7bc054767cd
      path: .
    components:
      - scd4x_stats
      - scd4x_alerts

logger:
  level: DEBUG   # DEBUG during bring-up to see the I2C scan + live values
  hardware_uart: USB_SERIAL_JTAG   # StampS3 has native USB only (no UART chip)

# Native HA API removed fleet-wide: HA is unused and MQTT is the sole transport.
# (On atlas the api component's WiFi/encryption loop load was jittering shared I2C.)
ota:
  - platform: esphome
  - platform: http_request

http_request:

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware Update"
    source: "${grow_app_base_url}/api/firmware/devices/${devicename}/manifest?token=${firmware_update_token}"

captive_portal:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "airq-${devicename}"
    password: !secret fallback_hotspot_key

mqtt:
  broker: 192.168.8.3
  port: 1883
  username: edge-daniel-home
  password: !secret mqtt_password
  topic_prefix: grow/daniel-home/m5stack-airq
  discovery: true
  discovery_prefix: grow/daniel-home/_discovery
  log_topic:
    topic: grow/daniel-home/m5stack-airq/debug
    level: NONE
  on_connect:
    - delay: 2s
    - mqtt.publish:
        topic: grow/daniel-home/m5stack-airq/_firmware/config
        retain: true
        qos: 1
        payload: |-
          {
            "schema": "grow-firmware-device.v1",
            "nodeId": "m5stack-airq",
            "projectName": "stackdrift.m5stack-airq",
            "packageOwner": "${package_owner}",
            "package": "m5stack-airq",
            "device": "m5stack-airq",
            "chipFamily": "ESP32-S3",
            "installedVersion": "${firmware_version}",
            "manifestUrl": "${grow_app_base_url}/api/firmware/devices/m5stack-airq/manifest"
          }
    # grow-ui.v2 short keys, unindented: keeps the payload small in flash and
    # on the wire (and under the ESP8266 send-buffer ceiling on the plugs).
    # Key legend: tests/test_ui_config_payloads.py.
    - mqtt.publish:
        topic: grow/daniel-home/m5stack-airq/_ui/config
        retain: true
        qos: 1
        payload: |-
          {"schema":"grow-ui.v2","nodeId":"m5stack-airq",
          "groups":[
          {"i":"scd40","t":"SCD40 (CO2 / RHT)","n":10,"v":"metrics","s":"dashboard","p":true},
          {"i":"sen55","t":"SEN55 (PM / VOC / NOx / RHT)","n":20,"v":"metrics","s":"dashboard","p":true},
          {"i":"thresholds","t":"CO2 Thresholds & Alerts","n":30,"s":"device-settings","d":"alerts"},
          {"i":"calibration","t":"SCD40 Calibration","n":40,"s":"device-settings","d":"calibration"},
          {"i":"maintenance","t":"Maintenance","n":80,"s":"device-settings","d":"maintenance"}],
          "entities":[
          {"c":"sensor","o":"co2","g":"scd40","r":"metric","n":10},
          {"c":"sensor","o":"co2_moving_average","g":"scd40","r":"metric","n":20,"l":"CO2 Moving Avg"},
          {"c":"sensor","o":"daily_max_co2","g":"scd40","r":"metric","n":30,"l":"CO2 Daily Max"},
          {"c":"sensor","o":"scd40_temperature","g":"scd40","r":"metric","n":40,"l":"SCD40 Temp"},
          {"c":"sensor","o":"scd40_humidity","g":"scd40","r":"metric","n":50,"l":"SCD40 RH"},
          {"c":"sensor","o":"pm__1um","g":"sen55","r":"metric","n":60,"l":"PM1.0"},
          {"c":"sensor","o":"pm__2_5um","g":"sen55","r":"metric","n":70,"l":"PM2.5"},
          {"c":"sensor","o":"pm__4um","g":"sen55","r":"metric","n":80,"l":"PM4.0"},
          {"c":"sensor","o":"pm__10um","g":"sen55","r":"metric","n":90,"l":"PM10"},
          {"c":"sensor","o":"sen55_temperature","g":"sen55","r":"metric","n":100,"l":"SEN55 Temp"},
          {"c":"sensor","o":"sen55_humidity","g":"sen55","r":"metric","n":110,"l":"SEN55 RH"},
          {"c":"sensor","o":"voc_index","g":"sen55","r":"metric","n":120},
          {"c":"sensor","o":"nox_index","g":"sen55","r":"metric","n":130},
          {"c":"number","o":"co2_high_threshold","g":"thresholds","n":10},
          {"c":"number","o":"co2_low_threshold","g":"thresholds","n":20},
          {"c":"binary_sensor","o":"co2_high_alert","g":"thresholds","n":30},
          {"c":"binary_sensor","o":"co2_low_alert","g":"thresholds","n":40},
          {"c":"number","o":"scd40_temperature_offset","g":"calibration","n":10},
          {"c":"switch","o":"scd40_auto_self_calibration","g":"calibration","n":20},
          {"c":"number","o":"co2_forced_calibration_target","g":"calibration","n":30},
          {"c":"button","o":"perform_co2_forced_calibration","g":"calibration","n":40},
          {"c":"button","o":"restart","g":"maintenance","n":10}]}

i2c:
  id: bus_a
  sda: 11           # internal sensor bus (SCD40 + SEN55), NOT the Grove port
  scl: 12
  frequency: 50kHz  # conservative — matches the known-good M5 reference
  scan: true

spi:
  clk_pin: 5
  mosi_pin: 6       # e-ink is write-only; no MISO

time:
  - platform: sntp
    id: sntp_time   # required by scd4x_stats for the daily CO2 rollover

web_server_base:
  id: my_web_server_base

web_server:
  version: 3
  port: 80
  sorting_groups:
    - id: co2
      name: "CO2"
      sorting_weight: 10
    - id: particulates
      name: "Particulates & Gases"
      sorting_weight: 20
    - id: alerts
      name: "CO2 Alerts"
      sorting_weight: 30
    - id: calibration
      name: "SCD40 Calibration"
      sorting_weight: 35
    - id: diagnostics
      name: "Diagnostics"
      sorting_weight: 40

# ---------------- SEN55 power gate (GPIO10) ----------------
# Driven HIGH on_boot (above). Exposed here only as the output the boot hook
# toggles; not surfaced to the UI.
output:
  - platform: gpio
    pin: 10
    id: sen55_power

# ---------------- Fonts for the e-ink ----------------
# gfonts:// is fetched + glyph-subset at compile time (build container has net).
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 16
  - file: "gfonts://Roboto@500"
    id: font_medium
    size: 20
  - file: "gfonts://Roboto@700"
    id: font_large
    size: 34

# ---------------- 1.54" e-ink display (air quality only) ----------------
display:
  - platform: waveshare_epaper
    id: eink
    model: 1.54inv2       # type-A 200x200. If your panel ghosts, try
                          # "1.54in-m5coreink-m09" (GDEW0154M09).
    cs_pin: 4
    dc_pin: 3
    reset_pin: 2
    busy_pin:
      number: 1
      inverted: false
    reset_duration: 2ms
    full_update_every: 1  # full refresh every update. This panel ghosts badly on
                          # partial refresh (values pile on stale pixels); at 60s
                          # the brief full-refresh flash is fine.
    update_interval: ${sensor_interval}
    lambda: |-
      // Header
      it.printf(100, 2, id(font_medium), TextAlign::TOP_CENTER, "Air Quality");
      it.line(0, 24, 200, 24);

      // CO2 headline (SCD40). "--" until the first reading lands.
      it.print(4, 28, id(font_medium), "CO2");
      if (isnan(id(co2_sensor).state))
        it.print(196, 28, id(font_medium), TextAlign::TOP_RIGHT, "-- ppm");
      else
        it.printf(196, 28, id(font_medium), TextAlign::TOP_RIGHT, "%.0f ppm", id(co2_sensor).state);
      it.line(0, 52, 200, 52);

      // Particulates (SEN55) — one helper for the four µg/m³ rows.
      auto pm_row = [&](int y, const char *label, float v) {
        it.print(4, y, id(font_small), label);
        if (isnan(v))
          it.print(196, y, id(font_small), TextAlign::TOP_RIGHT, "-- ug/m3");
        else
          it.printf(196, y, id(font_small), TextAlign::TOP_RIGHT, "%.1f ug/m3", v);
      };
      pm_row(56,  "PM1.0", id(pm1_0_sensor).state);
      pm_row(76,  "PM2.5", id(pm2_5_sensor).state);
      pm_row(96,  "PM4.0", id(pm4_0_sensor).state);
      pm_row(116, "PM10",  id(pm10_0_sensor).state);
      it.line(0, 140, 200, 140);

      // VOC / NOx indices (SEN55) — unitless integers.
      auto idx_row = [&](int y, const char *label, float v) {
        it.print(4, y, id(font_small), label);
        if (isnan(v))
          it.print(196, y, id(font_small), TextAlign::TOP_RIGHT, "--");
        else
          it.printf(196, y, id(font_small), TextAlign::TOP_RIGHT, "%.0f", v);
      };
      idx_row(144, "VOC Index", id(voc_sensor).state);
      idx_row(166, "NOx Index", id(nox_sensor).state);

# ---------------- Sensors ----------------
sensor:
  # CO2 + temp/RH (SCD40). The onboard temp/RH self-heat badly on this board
  # (raw ran ~15.6°C hot, validated 2026-05-31). They are now surfaced RAW
  # (temperature_offset: 0) on purpose, to illustrate the self-heating vs the
  # canonical SHT45 air reference (on the atoms3u rig). ASC is disabled; ambient-pressure
  # compensation is fed from the atoms3u BPS by the mqtt_subscribe relay below.
  - platform: scd4x
    id: co2_component
    address: 0x62
    i2c_id: bus_a
    update_interval: ${sensor_interval}
    automatic_self_calibration: false
    # Self-heat compensation: raw ran ~9°C hot vs the SHT45 reference, so subtract
    # 9°C. Runtime-adjust via the "SCD40 Temperature Offset" number (applies on
    # restart; ESPHome writes the offset only at setup()).
    temperature_offset: 9°C
    co2:
      name: "CO2"
      id: co2_sensor
      web_server: { sorting_group_id: co2, sorting_weight: 10 }
    temperature:
      name: "SCD40 Temperature"
      id: temperature_sensor
      web_server: { sorting_group_id: co2, sorting_weight: 40 }
    humidity:
      name: "SCD40 Humidity"
      id: humidity_sensor
      web_server: { sorting_group_id: co2, sorting_weight: 50 }

  # Particulates + VOC/NOx (SEN55). Full mode (PM sensors configured -> fan +
  # laser on). SEN55's own temp/RH are intentionally omitted.
  - platform: sen5x
    id: sen55_component
    address: 0x69
    i2c_id: bus_a
    update_interval: ${sensor_interval}
    # Self-heat compensation: raw ran ~2°C hot vs the SHT45 reference. The sen5x
    # offset is ADDED to the reading (confirmed empirically — opposite sign to the
    # scd4x), so use -2 to bring it down to ambient.
    temperature_compensation:
      offset: -2
    pm_1_0:
      name: "PM <1um"
      id: pm1_0_sensor
      web_server: { sorting_group_id: particulates, sorting_weight: 10 }
    pm_2_5:
      name: "PM <2.5um"
      id: pm2_5_sensor
      web_server: { sorting_group_id: particulates, sorting_weight: 20 }
    pm_4_0:
      name: "PM <4um"
      id: pm4_0_sensor
      web_server: { sorting_group_id: particulates, sorting_weight: 30 }
    pm_10_0:
      name: "PM <10um"
      id: pm10_0_sensor
      web_server: { sorting_group_id: particulates, sorting_weight: 40 }
    voc:
      name: "VOC Index"
      id: voc_sensor
      web_server: { sorting_group_id: particulates, sorting_weight: 50 }
    nox:
      name: "NOx Index"
      id: nox_sensor
      web_server: { sorting_group_id: particulates, sorting_weight: 60 }
    # SEN55 onboard RHT — surfaced RAW (no temperature_compensation), same board
    # self-heat as the SCD40; kept for comparison against the SHT45 reference.
    temperature:
      name: "SEN55 Temperature"
      id: sen55_temperature
      web_server: { sorting_group_id: particulates, sorting_weight: 70 }
    humidity:
      name: "SEN55 Humidity"
      id: sen55_humidity
      web_server: { sorting_group_id: particulates, sorting_weight: 80 }

  # Ambient-pressure compensation for the SCD40 CO2, sourced from the
  # atoms3u-sensor-rig's QMP6988 (BPS) over the shared MQTT broker. NDIR CO2
  # drifts with barometric pressure; the SCD4x default assumes a fixed 1013 hPa.
  # We feed live station pressure but DECOUPLED from the SCD40 read cycle: unlike
  # ambient_pressure_compensation_source (which writes 0xE000 inside the SCD4x
  # update() right before the read — implicated in stalling the atoms3u SCD41,
  # grow-fleet 91fc3f5), this writes on the MQTT callback and only when the
  # integer hPa changes.
  - platform: mqtt_subscribe
    name: "Ambient Pressure (atoms3u BPS)"
    id: ambient_pressure_ext
    internal: true          # relay only; keeps this node's UI air-quality-only
    topic: grow/daniel-home/atoms3u-sensor-rig/sensor/barometric_pressure/state
    qos: 0
    unit_of_measurement: "hPa"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    filters:
      # If the atoms3u feed stops (offline / sensor drop), go NaN after 5 min so
      # we never push a stale pressure; the SCD40 keeps its last-good value.
      - timeout:
          timeout: 5min
          value: !lambda 'return NAN;'
    on_value:
      then:
        - lambda: |-
            const float p = x;  // hPa == mBar; the SCD4x setter wants hPa, no conversion
            if (!std::isnan(p) && p >= 700.0f && p <= 1200.0f) {
              id(co2_component).set_ambient_pressure_compensation(p);
            }

  # Diagnostics
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    web_server: { sorting_group_id: diagnostics, sorting_weight: 10 }
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    web_server: { sorting_group_id: diagnostics, sorting_weight: 20 }

# ---------------- CO2 trend stats (daily max + moving average) ----------------
# scd4x_stats requires temp/humidity refs even though we only emit CO2 outputs.
scd4x_stats:
  id: co2_stats
  co2_sensor: co2_sensor
  temperature_sensor: temperature_sensor
  humidity_sensor: humidity_sensor
  time_id: sntp_time
  daily_max_co2:
    name: "Daily Max CO2"
    id: daily_max_co2
    web_server: { sorting_group_id: co2, sorting_weight: 20 }
  co2_moving_avg:
    name: "CO2 Moving Average"
    id: co2_moving_avg
    web_server: { sorting_group_id: co2, sorting_weight: 30 }

# ---------------- CO2 alerts only (no temp/humidity/VPD) ----------------
# temp/humidity refs are required by the component but drive no alerts here.
scd4x_alerts:
  id: co2_alerts
  co2_sensor: co2_sensor
  temperature_sensor: temperature_sensor
  humidity_sensor: humidity_sensor
  co2_high_threshold: 1500
  co2_low_threshold: 800
  co2_high_alert:
    name: "CO2 High Alert"
    id: co2_high_alert
    web_server: { sorting_group_id: alerts, sorting_weight: 30 }
  co2_low_alert:
    name: "CO2 Low Alert"
    id: co2_low_alert
    web_server: { sorting_group_id: alerts, sorting_weight: 40 }
  co2_high_threshold_number:
    name: "CO2 High Threshold"
    web_server: { sorting_group_id: alerts, sorting_weight: 10 }
  co2_low_threshold_number:
    name: "CO2 Low Threshold"
    web_server: { sorting_group_id: alerts, sorting_weight: 20 }

# scd4x_alerts emits binary_sensor + number entities; the status sensor + these
# dummy internal template entities register those platforms so its codegen has
# somewhere to attach (mirrors the known-good AtomS3U rig config).
binary_sensor:
  - platform: template
    name: "Dummy Template Binary Sensor"
    id: dummy_template_binary_sensor
    internal: true

number:
  - platform: template
    name: "Dummy Template Number"
    id: dummy_template_number
    min_value: 0
    max_value: 1
    step: 1
    optimistic: true
    internal: true

  # SCD40 temperature offset (°C subtracted to compensate self-heating).
  # ESPHome writes this to the sensor only at setup(), so a change takes effect
  # after a Restart; the config default is 0°C (raw).
  - platform: template
    name: "SCD40 Temperature Offset"
    id: scd40_temp_offset
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 20
    step: 0.1
    initial_value: 9      # mirrors the scd4x config; the config value is applied at boot
    restore_value: false
    optimistic: true
    mode: box
    web_server: { sorting_group_id: calibration, sorting_weight: 10 }
    set_action:
      - lambda: 'id(co2_component).set_temperature_offset(x);'

  # Target reference CO2 (ppm) for a forced recalibration — used by the
  # "Perform CO2 Forced Calibration" button. 420 ≈ clean outdoor air.
  - platform: template
    name: "CO2 Forced Calibration Target"
    id: co2_frc_target
    entity_category: config
    unit_of_measurement: "ppm"
    min_value: 400
    max_value: 2000
    step: 5
    initial_value: 420
    restore_value: true
    optimistic: true
    mode: box
    web_server: { sorting_group_id: calibration, sorting_weight: 30 }

switch:
  # Automatic self-calibration. Config default is OFF (set on the scd4x block);
  # ESPHome writes ASC to the sensor only at setup(), so toggling here takes
  # effect after a Restart.
  - platform: template
    name: "SCD40 Auto Self Calibration"
    id: scd40_asc
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    web_server: { sorting_group_id: calibration, sorting_weight: 20 }
    turn_on_action:
      - lambda: 'id(co2_component).set_automatic_self_calibration(true);'
    turn_off_action:
      - lambda: 'id(co2_component).set_automatic_self_calibration(false);'

button:
  - platform: template
    name: "Check Firmware Update"
    entity_category: diagnostic
    web_server: { sorting_group_id: diagnostics, sorting_weight: 50 }
    on_press:
      - update.check:
          id: firmware_update
  - platform: restart
    name: "Restart"
    web_server: { sorting_group_id: diagnostics, sorting_weight: 60 }

  # Forced recalibration: assert the SCD40 is in air of the target ppm (set via
  # "CO2 Forced Calibration Target") and press. Runs live (stop -> FRC -> restart).
  - platform: template
    name: "Perform CO2 Forced Calibration"
    entity_category: config
    web_server: { sorting_group_id: calibration, sorting_weight: 40 }
    on_press:
      - scd4x.perform_forced_calibration:
          id: co2_component
          value: !lambda 'return (uint16_t) id(co2_frc_target).state;'

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      web_server: { sorting_group_id: diagnostics, sorting_weight: 90 }
  - platform: version
    name: "ESPHome Version"
    web_server: { sorting_group_id: diagnostics, sorting_weight: 100 }
