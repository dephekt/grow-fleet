# Athom Smart Plug US V2 — Grow light actuator.
#
# The shared plug baseline (hardware map, power metering, MQTT/OTA transport,
# diagnostics) lives in packages/athom-plug-base.yaml; this file holds the
# photoperiod scheduling and the light's safety contract.
#
# Safety contract (differs from irrigation-pump on purpose):
#   - relay restore_mode: RESTORE_DEFAULT_OFF — a power blip mid-photoperiod
#     restores the light to its pre-blip state instead of leaving the canopy
#     dark (or lit) until someone notices. A pump must fail OFF; a light must
#     fail to WHATEVER IT WAS, because photoperiod interruptions stress the
#     plants in both directions. Relay transitions flush preferences to flash
#     immediately (see the relay's on_turn_on/off), so the restored state is
#     the true pre-blip state, not a stale interval-synced copy.
#   - No max-on watchdog: a grow light legitimately runs 12-18 h at a stretch.
#   - Overcurrent cutoff at ${current_limit} A: photoperiod loses to fire
#     safety. The base package trips on RAW current samples (~1 s cadence,
#     ahead of the 10 s averaging filter) and this file's overcurrent_trip
#     LATCHES by disarming Light Schedule — the armed window would otherwise
#     re-energize the faulted load within 30 s. Re-arm the schedule manually
#     once the load is fixed.
#
# Scheduling contract (desired-state model):
#   The photoperiod window lives IN THIS FIRMWARE. The control system only
#   sets desired state — On Time, Off Time, and the Light Schedule arm switch
#   (all persisted to flash) — and the plug applies and maintains it on its
#   own sntp clock. The light keeps its photoperiod through app, broker, and
#   Wi-Fi outages alike.
#   - Window is half-open [on, off) in local wall time and may wrap midnight
#     (18:00 -> 06:00 is a 12/12 flower window). on == off is an EMPTY window
#     (always off) — disarm the schedule for manual control, don't set equal
#     times to force a state.
#   - DST edge case: the window is evaluated by level against local wall time,
#     so on fall-back night an edge inside the repeated 01:00-02:00 hour fires
#     twice (an off edge there re-lights for up to an hour); spring-forward
#     shifts a 02:xx edge to 03:00. Avoid window edges in the 01:00-03:00 band
#     if that matters.
#   - While armed, the window is re-asserted every 30 s, so a manual/physical
#     toggle against an armed schedule reverts within 30 s. That is the
#     point: the schedule owns the relay. Disarm it to take manual control.
#   - Until sntp syncs after boot, the relay stays in its restored state; the
#     window takes over at first sync (on_time_sync) or next 30 s tick.
#   - The timezone is desired state too: the Time Zone text entity holds a
#     runtime POSIX-TZ override (empty = the base package's build default);
#     changes and clears both apply live, at the next 30 s tick. DST rules
#     ride inside the string, so transitions happen on-device.
#     dephekt/grow-app#69 tracks the app-side site setting that will feed it.
#
# Flash / build:
#   make build grow-light
#   esphome run  devices/grow-light.yaml --device /dev/ttyUSB0
#   esphome logs devices/grow-light.yaml --device /dev/ttyUSB0

substitutions:
  devicename: grow-light
  friendlyname: "Grow Light"
  power_sensor_name: "Light Power"
  power_icon: mdi:lightbulb-on
  # NEMA 5-15 (Athom US V2) is rated 15 A peak / 12 A continuous, and a grow
  # light is a continuous load — a sustained 13-15 A draw overheats the plug
  # without ever crossing the base package's 16 A threshold. A light that
  # legitimately needs more than 12 A does not belong on this plug.
  current_limit: "12"

packages:
  athom_plug: !include packages/athom-plug-base.yaml

# The timezone platform is pulled from the pinned stackdrift/esphome-components
# commit tracked in fleet.yaml. Must stay in this file (not the package):
# scripts/fleetlib.py reads external_components flat from the device YAML for
# packaging provenance.
external_components:
  - source:
      type: git
      url: https://github.com/dephekt/esphome-components.git
      ref: 744d21a1bd464af921b22e40affafd69aa5893a1
      path: .
    components: ["timezone"]

wifi:
  # Never reboot for connectivity: the default 15 min reboot_timeout would
  # restart the plug mid-outage, dropping the synced clock — and without a
  # network sntp can't re-sync, so the photoperiod would freeze. An autonomous
  # actuator rides out outages on its running clock instead.
  reboot_timeout: 0s

mqtt:
  # Same rationale as the wifi reboot_timeout: a broker outage must not
  # reboot the plug out of its synced clock.
  reboot_timeout: 0s
  on_connect:
    # Package list merge appends this after the base's delay + _firmware/config
    # publish.
    # NOTE: "component" must match the MQTT discovery topic's component slug —
    # ESPHome publishes text_sensor discovery under "sensor", so ip_address is
    # declared as sensor here or grow-app never matches it.
    - mqtt.publish:
        topic: grow/daniel-home/${devicename}/_ui/config
        retain: true
        qos: 1
        payload: |-
          {
            "schema": "grow-ui.v1",
            "nodeId": "${devicename}",
            "groups": [
              { "id": "overview", "title": "${friendlyname}", "order": 10, "variant": "metrics", "surface": "dashboard", "defaultOpen": true },
              { "id": "controls", "title": "Controls", "order": 20, "variant": "quick-controls", "surface": "dashboard", "defaultOpen": true },
              { "id": "schedule", "title": "Photoperiod Schedule", "order": 30, "surface": "device-settings", "deviceSettingsSection": "controls", "defaultOpen": true },
              { "id": "maintenance", "title": "Maintenance", "order": 80, "surface": "device-settings", "deviceSettingsSection": "maintenance", "defaultOpen": false },
              { "id": "diagnostics", "title": "Diagnostics", "order": 90, "surface": "device-settings", "deviceSettingsSection": "diagnostics", "defaultOpen": false }
            ],
            "entities": [
              { "component": "sensor",      "objectId": "light_power",          "group": "overview",    "role": "metric",        "order": 10, "label": "Light Power" },
              { "component": "sensor",      "objectId": "voltage",              "group": "overview",    "role": "metric",        "order": 20 },
              { "component": "sensor",      "objectId": "current",              "group": "overview",    "role": "metric",        "order": 30 },
              { "component": "sensor",      "objectId": "total_daily_energy",   "group": "overview",    "role": "metric",        "order": 40, "label": "Daily Energy" },
              { "component": "switch",      "objectId": "grow_light",           "group": "controls",    "role": "quick-control", "order": 10, "label": "Light" },
              { "component": "switch",      "objectId": "light_schedule",       "group": "schedule",    "order": 10, "label": "Schedule Armed" },
              { "component": "time",        "objectId": "light_on_time",        "group": "schedule",    "order": 20, "label": "On Time" },
              { "component": "time",        "objectId": "light_off_time",       "group": "schedule",    "order": 30, "label": "Off Time" },
              { "component": "text",        "objectId": "time_zone",            "group": "schedule",    "order": 40, "label": "Time Zone (POSIX)" },
              { "component": "button",      "objectId": "check_firmware_update","group": "maintenance", "order": 10 },
              { "component": "button",      "objectId": "restart",              "group": "maintenance", "order": 20 },
              { "component": "sensor",      "objectId": "wifi_signal",          "group": "diagnostics", "order": 10 },
              { "component": "sensor",      "objectId": "uptime",               "group": "diagnostics", "order": 20 },
              { "component": "sensor",      "objectId": "ip_address",           "group": "diagnostics", "order": 30 }
            ]
          }
    # This plug is the anchor for the "main" logical light: it owns the name/type
    # plus the on/off relay, the photoperiod schedule, and power metering. The DAC
    # dimmer lives on a different node (atoms3u-sensor-rig) and publishes its own
    # _lights fragment; grow-app merges both by light id into one Main Light card.
    # Roles reference this node's own MQTT objectIds.
    - mqtt.publish:
        topic: grow/daniel-home/${devicename}/_lights/config
        retain: true
        qos: 1
        payload: |-
          {
            "schema": "grow-lights.v1",
            "nodeId": "${devicename}",
            "lights": [
              {
                "id": "main",
                "name": "Main Light",
                "type": "full-spectrum",
                "order": 10,
                "roles": {
                  "power": "grow_light",
                  "scheduleArm": "light_schedule",
                  "onTime": "light_on_time",
                  "offTime": "light_off_time",
                  "metrics": ["light_power", "apparent_power", "voltage", "current", "power_factor", "total_daily_energy"]
                }
              }
            ]
          }

time:
  - id: !extend sntp_time
    on_time_sync:
      - script.execute: apply_light_schedule

# ─── Relay — Grow Light ───────────────────────────────────────────────────────
# NOTE: keep switch: before datetime: — ESP8266 preference offsets are
# positional in setup order (see the base package header).
switch:
  - platform: gpio
    name: "Grow Light"
    id: light_relay
    pin: GPIO12
    # RESTORE_DEFAULT_OFF: after a power blip the relay comes back in its
    # pre-blip state (persisted to flash), so a brownout mid-photoperiod does
    # not silently leave the light off for the rest of the day. First boot
    # ever defaults OFF. Once sntp syncs, an armed schedule overrides this
    # restored state anyway.
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:lightbulb
    # Flush preferences to flash on every transition so the restored state is
    # the true pre-blip state. Without this the state rides the base package's
    # 1h interval sync and a power blip could restore a stale state.
    # Relay toggles are rare (2/day from the schedule), so the flash cost is
    # negligible; sync() is a no-op when nothing changed.
    on_turn_on:
      - lambda: global_preferences->sync();
    on_turn_off:
      - lambda: global_preferences->sync();

  # Arms the firmware-resident photoperiod window (see header). OFF = manual
  # control of the relay; ON = the window owns the relay and re-asserts it
  # every 30 s. Disarming leaves the relay wherever it currently is.
  - platform: template
    name: "Light Schedule"
    id: light_schedule
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:calendar-clock
    on_turn_on:
      - script.execute: apply_light_schedule
      - lambda: global_preferences->sync();
    on_turn_off:
      - lambda: global_preferences->sync();

# ─── Photoperiod window ───────────────────────────────────────────────────────
# Defaults are a veg-friendly 18/6 (on 06:00, off 00:00). Values persist to
# flash; the app (or the plug's web UI) edits them over MQTT.
datetime:
  - platform: template
    name: "Light On Time"
    id: light_on_time
    type: time
    optimistic: true
    restore_value: true
    initial_value: "06:00:00"
    icon: mdi:weather-sunset-up
    on_value:
      - script.execute: apply_light_schedule
      - lambda: global_preferences->sync();

  - platform: template
    name: "Light Off Time"
    id: light_off_time
    type: time
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
    icon: mdi:weather-sunset-down
    on_value:
      - script.execute: apply_light_schedule
      - lambda: global_preferences->sync();

interval:
  - interval: 30s
    then:
      - script.execute: apply_light_schedule

script:
  - id: apply_light_schedule
    then:
      - lambda: |-
          if (!id(light_schedule).state)
            return;
          auto now = id(sntp_time).now();
          if (!now.is_valid())
            return;
          // Compare in seconds: the datetime entities accept hh:mm:ss over
          // MQTT, and truncating to minutes would make times differing only
          // in seconds collapse into the on == off empty-window branch.
          const int t   = now.hour * 3600 + now.minute * 60 + now.second;
          const int on  = id(light_on_time).hour * 3600 + id(light_on_time).minute * 60 + id(light_on_time).second;
          const int off = id(light_off_time).hour * 3600 + id(light_off_time).minute * 60 + id(light_off_time).second;
          bool want;
          if (on == off)
            want = false;                      // empty window — always off
          else if (on < off)
            want = (t >= on && t < off);       // same-day window
          else
            want = (t >= on || t < off);       // wraps midnight
          if (want && !id(light_relay).state)
            id(light_relay).turn_on();
          else if (!want && id(light_relay).state)
            id(light_relay).turn_off();

  # Overcurrent response (detection in the base package): photoperiod loses
  # to fire safety. Disarming Light Schedule first LATCHES the trip —
  # otherwise the armed window re-energizes the faulted load within 30 s.
  # Re-arm manually after fixing the load.
  - id: overcurrent_trip
    parameters:
      amps: float
    then:
      - logger.log:
          level: ERROR
          format: "Overcurrent: %.1f A > ${current_limit} A — relay off, schedule disarmed"
          args: [amps]
      - switch.turn_off: light_schedule
      - switch.turn_off: light_relay

# ─── Physical button (GPIO5) ─────────────────────────────────────────────────
# Short press: toggle relay (manual override; an armed schedule re-asserts the
# window within 30 s — disarm Light Schedule first for a lasting override).
# Long press 4 s: factory reset (from the base package).
binary_sensor:
  - id: !extend power_button
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - switch.toggle: light_relay

# ─── Timezone override ────────────────────────────────────────────────────────
# Runtime POSIX-TZ override for the schedule clock (see header). Changes and
# clears apply live at the next 30 s tick; clearing restores the build default.
# Invalid strings (unparseable, over 63 chars, embedded NUL) are rejected and
# the previous value re-published so an MQTT writer sees the write not take.
text:
  - platform: timezone
    name: "Time Zone"
    id: tz_override
    time_id: sntp_time
