# Athom Smart Plug US V2 — Irrigation pump monitor + maintenance override.
#
# The shared plug baseline (hardware map, power metering, MQTT/OTA transport,
# diagnostics, sntp + America/Chicago timezone) lives in
# packages/athom-plug-base.yaml; this file holds only the irrigation-pump
# contract.
#
# Role:
#   The SeaFlo irrigation pump is powered by design and self-cycles on its own
#   pressure switch — the OpenSprinkler valve gates irrigation, NOT this relay.
#   This plug is telemetry (Pump Power draw) plus a manual override to cut
#   supply for maintenance. It is not an actuator.
#
# Relay contract:
#   - restore_mode: RESTORE_DEFAULT_ON — powered on by default and re-energized
#     after a power blip, but a deliberate maintenance-off persists across a
#     reboot. (Contrast the runoff bilge pump: ALWAYS_ON + internal, must never
#     be cut.)
#   - Overcurrent (raw sample > ${current_limit} A, detected in the base
#     package): relay off — fire safety wins over "always on" (overcurrent_trip).
#
# Time: the base package's sntp is baked to America/Chicago (DST-correct), which
# is all total_daily_energy needs for a local-midnight reset. No schedule and no
# runtime timezone entity here — there is no wall-clock behavior to reconcile.
#
# Flash / build:
#   make build irrigation-pump
#   esphome run  devices/irrigation-pump.yaml --device /dev/ttyUSB0
#   esphome logs devices/irrigation-pump.yaml --device /dev/ttyUSB0

substitutions:
  devicename: irrigation-pump
  friendlyname: "Irrigation Pump"
  power_sensor_name: "Pump Power"
  power_icon: mdi:pump

packages:
  athom_plug: !include packages/athom-plug-base.yaml

mqtt:
  on_connect:
    # Package list merge appends this after the base's delay + _firmware/config
    # publish.
    # NOTE: "component" must match the MQTT discovery topic's component slug —
    # ESPHome publishes text_sensor discovery under "sensor", so ip_address is
    # declared as sensor here or grow-app never matches it.
    # grow-ui.v2 short keys, unindented: AsyncMqttClient silently drops any
    # publish over the ESP8266 send buffer (2 x TCP_MSS = 2920 B).
    # Key legend: tests/test_ui_config_payloads.py.
    - mqtt.publish:
        topic: grow/daniel-home/${devicename}/_ui/config
        retain: true
        qos: 1
        payload: |-
          {"schema":"grow-ui.v2","nodeId":"${devicename}",
          "groups":[
          {"i":"overview","t":"Irrigation","n":10,"v":"metrics","s":"dashboard","p":true},
          {"i":"settings","t":"Settings","n":30,"s":"device-settings","d":"controls"},
          {"i":"maintenance","t":"Maintenance","n":80,"s":"device-settings","d":"maintenance"},
          {"i":"diagnostics","t":"Diagnostics","n":90,"s":"device-settings","d":"diagnostics"}],
          "entities":[
          {"c":"sensor","o":"pump_power","g":"overview","r":"metric","n":10,"l":"Pump Power"},
          {"c":"sensor","o":"voltage","g":"overview","r":"metric","n":20},
          {"c":"sensor","o":"current","g":"overview","r":"metric","n":30},
          {"c":"sensor","o":"total_daily_energy","g":"overview","r":"metric","n":40,"l":"Daily Energy"},
          {"c":"switch","o":"irrigation_pump","g":"settings","n":10,"l":"Pump Supply (maintenance)"},
          {"c":"button","o":"check_firmware_update","g":"maintenance","n":10},
          {"c":"button","o":"restart","g":"maintenance","n":20},
          {"c":"sensor","o":"wifi_signal","g":"diagnostics","n":10},
          {"c":"sensor","o":"uptime","g":"diagnostics","n":20},
          {"c":"sensor","o":"ip_address","g":"diagnostics","n":30}]}

# ─── Relay — Irrigation Pump supply ───────────────────────────────────────────
# On by design; the switch (or the physical button) cuts supply for maintenance.
# Flush to flash on each transition so a power blip restores the true last state
# (e.g. an overcurrent-off or a maintenance-off is not lost to the 1 h sync).
switch:
  - platform: gpio
    name: "Irrigation Pump"
    id: pump_relay
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_ON
    icon: mdi:water-pump
    on_turn_on:
      - lambda: global_preferences->sync();
    on_turn_off:
      - lambda: global_preferences->sync();

# ─── Physical button (GPIO5) ─────────────────────────────────────────────────
# Short press: toggle the relay (local maintenance override).
# Long press 4 s: factory reset (from the base package).
binary_sensor:
  - id: !extend power_button
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - switch.toggle: pump_relay

# ─── Scripts ──────────────────────────────────────────────────────────────────
script:
  # Overcurrent response (detection in the base package): a pump fault must not
  # keep the relay energized — fire safety wins over "always on".
  - id: overcurrent_trip
    parameters:
      amps: float
    then:
      - logger.log:
          level: ERROR
          format: "Overcurrent: %.1f A > ${current_limit} A — pump relay off"
          args: [amps]
      - switch.turn_off: pump_relay
