# Athom Smart Plug US V2 — shared fleet baseline (ESPHome package).
#
# Hardware (Athom Smart Plug US V2):
#   SoC:    ESP8285 (ESP8266 core, 2 MB flash)
#   Relay:  GPIO12
#   Button: GPIO5  (active-low, INPUT_PULLUP)
#   LED:    GPIO13 (status_led, inverted — LOW = ON)
#   Power:  CSE7766 via UART RX (4800 baud, EVEN parity)
#
# Consumed from a device config via:
#   packages:
#     athom_plug: !include packages/athom-plug-base.yaml
#
# A consuming device config MUST provide:
#   - substitutions: devicename, friendlyname, power_sensor_name, power_icon
#   - a relay switch on GPIO12 — restore_mode is the device's safety
#     contract (fail OFF, fail ON, or restore pre-blip state), so it stays
#     in the device file where that contract is documented
#   - script overcurrent_trip with a single float parameter `amps` — the
#     action taken when a RAW current sample exceeds ${current_limit} (see
#     the cse7766 current sensor below); the detection is shared, the
#     response is the device's call
#   - its mqtt on_connect _ui/config publish (appended after this package's
#     _firmware/config publish by ESPHome's package list merge)
# Optional overrides: current_limit (default "16"), sensor_update_interval,
# current_noise_floor / power_noise_floor, or any dict-merge key (e.g. wifi/mqtt
# reboot_timeout).
#
# Do NOT pass firmware_version/package_owner via `!include ... vars:` —
# package vars would shadow the `-s` CLI substitutions that
# scripts/compile_devices.py injects at build time.
#
# NOTE for edits: ESP8266 preference offsets are positional (allocated in
# component setup order). Keep the relative order of the sections below —
# reordering pref-allocating components (globals, sensors with restore,
# lights) shifts the flash layout and resets persisted state fleet-wide on
# the next OTA.

substitutions:
  firmware_version: dev
  grow_app_base_url: "http://192.168.8.3:3080"
  package_owner: stackdrift-firmware
  firmware_update_token: !secret firmware_update_token
  sensor_update_interval: "10s"
  current_limit: "16"
  # Readings below these floor to zero, so a load under them is indistinguishable
  # from nothing plugged in — lower them on any device whose real draw is small.
  current_noise_floor: "0.060"
  power_noise_floor: "3.0"
  # Self-validating defaults — a device that forgets to override these still
  # passes the substitution pass with an obvious placeholder name.
  power_sensor_name: "Power"
  power_icon: mdi:flash

esphome:
  name: ${devicename}
  friendly_name: ${friendlyname}
  project:
    name: stackdrift.${devicename}
    version: ${firmware_version}
  # ESP8285 has 2 MB flash; lock to that ld script so PIO doesn't auto-pick 4 MB.
  platformio_options:
    board_upload.flash_size: 2MB
    board_upload.maximum_size: 2097152
    board_build.ldscript: eagle.flash.2m.ld

esp8266:
  board: esp8285
  restore_from_flash: true

# 1h, not ESPHome's 1min default: the energy accumulators dirty the single
# ESP8266 preferences sector on every metering update, so a short interval
# erases that sector hundreds of times a day (~50-80k erases/year vs ~100k
# rated endurance). Control state that must survive a power cut (relay state,
# schedule arms, setpoints) doesn't ride this interval — device configs flush
# it immediately via global_preferences->sync() in their automations. Worst
# case a power cut loses ≤1 h of energy accounting; it never loses control
# state.
preferences:
  flash_write_interval: 1h

logger:
  level: INFO
  # CSE7766 lives on the hardware UART (RX); baud_rate 0 disables the serial
  # logger so it doesn't fight the power-meter UART.
  baud_rate: 0

# Native HA API removed fleet-wide: HA is unused and MQTT is the sole transport.
ota:
  - platform: esphome
  - platform: http_request

http_request:
  # ESP8266 cannot verify TLS certificates (no cert store in firmware).
  verify_ssl: false

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware Update"
    source: "${grow_app_base_url}/api/firmware/devices/${devicename}/manifest?token=${firmware_update_token}"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# MQTT -> site broker. Discovery scoped to grow/daniel-home/_discovery so
# grow-app can derive entities from retained payloads without a global
# homeassistant/# prefix.
mqtt:
  broker: 192.168.8.3              # media-server LAN IP; mosquitto-site :1883
  port: 1883
  username: edge-daniel-home
  password: !secret mqtt_password
  topic_prefix: grow/daniel-home/${devicename}
  discovery: true
  discovery_prefix: grow/daniel-home/_discovery
  log_topic:
    topic: grow/daniel-home/${devicename}/debug
    level: NONE
  on_connect:
    - delay: 2s
    - mqtt.publish:
        topic: grow/daniel-home/${devicename}/_firmware/config
        retain: true
        qos: 1
        payload: |-
          {
            "schema": "grow-firmware-device.v1",
            "nodeId": "${devicename}",
            "projectName": "stackdrift.${devicename}",
            "packageOwner": "${package_owner}",
            "package": "${devicename}",
            "device": "${devicename}",
            "chipFamily": "ESP8266",
            "installedVersion": "${firmware_version}",
            "manifestUrl": "${grow_app_base_url}/api/firmware/devices/${devicename}/manifest"
          }

# NOTE: web_server v2 used here. v3 requires considerably more flash/RAM for
# its bundled React UI assets; ESP8285 (2 MB flash, ~80 KB heap after wifi/ssl)
# becomes tight. v2 is the safe choice for 8266-class hardware.
web_server:
  version: 2
  port: 80

time:
  - platform: sntp
    id: sntp_time
    # LAN first: the GL-MT6000's chrony serves NTP on the LAN, so a reboot
    # during a WAN outage can still sync (pool.ntp.org alone would leave
    # time-dependent behavior frozen until internet returned).
    servers:
      - 192.168.8.1
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    # Explicit: schedules and total_daily_energy midnight resets are in LOCAL
    # wall time. Without this the build bakes in whatever timezone the
    # compiling host happens to have.
    timezone: America/Chicago

# ─── Power metering (CSE7766) ─────────────────────────────────────────────────
# Calibration: Athom ships NO explicit calibration multipliers for the CSE7766
# in their published config — only the throttle/clamp filters below. Do not
# invent numbers; the chip's factory cal is used directly.
uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

globals:
  - id: total_energy_accum
    type: float
    restore_value: yes
    initial_value: "0.0"

sensor:
  - platform: cse7766
    current:
      name: "Current"
      id: plug_current
      icon: mdi:current-ac
      filters:
        - throttle_average: ${sensor_update_interval}
        # Suppress relay leakage (${current_noise_floor} A).
        - lambda: if (x < ${current_noise_floor}) return 0.0; else return x;
      # Safety trip on RAW samples (~1 s), not the published value: the
      # throttle_average above would dilute a short fault below the threshold
      # and delay detection by up to 10 s. The response is the device's call —
      # every consumer defines script overcurrent_trip (turn the relay off,
      # log only, latch by disarming a schedule, ...). Note this re-fires
      # about once a second for as long as the fault persists.
      on_raw_value:
        - if:
            condition:
              lambda: return x > ${current_limit};
            then:
              - script.execute:
                  id: overcurrent_trip
                  amps: !lambda return x;

    voltage:
      name: "Voltage"
      id: plug_voltage
      icon: mdi:sine-wave
      filters:
        - throttle_average: ${sensor_update_interval}

    power:
      name: "${power_sensor_name}"
      id: plug_power
      icon: ${power_icon}
      filters:
        - throttle_average: ${sensor_update_interval}
        # Suppress standby noise (${power_noise_floor} W).
        - lambda: if (x < ${power_noise_floor}) return 0.0; else return x;

    energy:
      name: "Energy"
      id: energy_sensor
      icon: mdi:lightning-bolt
      unit_of_measurement: kWh
      filters:
        - throttle: ${sensor_update_interval}
        - multiply: 0.001
      on_value:
        then:
          - lambda: |-
              static float prev = 0.0;
              float cur = id(energy_sensor).state;
              id(total_energy_accum) += cur - prev;
              prev = cur;
              id(total_energy_template).update();

    apparent_power:
      name: "Apparent Power"
      icon: mdi:power
      filters:
        - throttle_average: ${sensor_update_interval}

    power_factor:
      name: "Power Factor"
      icon: mdi:percent-outline
      filters:
        - throttle_average: ${sensor_update_interval}

  - platform: template
    name: "Total Energy"
    id: total_energy_template
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    icon: mdi:lightning-bolt
    accuracy_decimals: 3
    lambda: |-
      return id(total_energy_accum);
    # Publishes only via the energy sensor's on_value update() above — a poll
    # interval here would double-publish while metering and republish the
    # unchanged retained value every 10 s while the load is off.
    update_interval: never

  - platform: total_daily_energy
    name: "Total Daily Energy"
    id: daily_energy_sensor
    restore: true
    power_id: plug_power
    unit_of_measurement: kWh
    icon: mdi:hours-24
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s
    entity_category: diagnostic

# ─── Status LED (GPIO13, active-low) ─────────────────────────────────────────
light:
  - platform: status_led
    name: "Status LED"
    id: blue_led
    disabled_by_default: true
    pin:
      number: GPIO13
      inverted: true

# ─── Physical button (GPIO5) ─────────────────────────────────────────────────
# Long press 4 s: factory reset (Athom pattern). Devices with a manually
# togglable relay extend this with a short-press timing:
#   binary_sensor:
#     - id: !extend power_button
#       on_multi_click: [ ... ]
binary_sensor:
  - platform: gpio
    pin:
      number: 5
      mode: INPUT_PULLUP
      inverted: true
    id: power_button
    name: "Power Button"
    # internal, not disabled_by_default: this entity exists only to drive
    # on_multi_click, and grow-app ignores the enabled_by_default discovery
    # hint — a merely-disabled entity leaks into its fallback "Other" section.
    internal: true
    on_multi_click:
      - timing:
          - ON for at least 4s
        then:
          - button.press: factory_reset_button

button:
  - platform: template
    name: "Check Firmware Update"
    id: check_firmware_update
    entity_category: diagnostic
    on_press:
      - update.check:
          id: firmware_update

  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: diagnostic

  # Keep factory reset accessible via long-press but hidden from MQTT/discovery.
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
    internal: true

# ─── Diagnostics ─────────────────────────────────────────────────────────────
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic
